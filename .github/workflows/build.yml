name: Build Hondana APK

# Builds the signed release APK and publishes every build on main as a release
# tagged r<commit count>. The phone downloads the newest one from a stable link,
#   https://github.com/<owner>/<repo>/releases/latest/download/hondana-arm64-v8a.apk
# and the app's updater compares that r number with its own build number.
#
# The APK is built here rather than in a dev container because Google's Maven
# repository and the Android SDK (dl.google.com) are often blocked there.
# GitHub's Ubuntu runners ship the Android SDK preinstalled.
#
# The first push of a repo's history doesn't fire `push` workflows; any later
# push to main (or a manual run from the Actions tab) does.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      # Needed to publish the APK as a release asset.
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # versionCode is the commit count, which needs full history.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Standard runners for private repos have 2 cores and ~7 GB of RAM. One
      # JVM (Kotlin compiling in-process) avoids two 4 GB heaps fighting.
      - name: Tune Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      # The release key is in the repo only as signing/hondana-release.tar.gpg,
      # encrypted (AES-256) with the SIGNING_PASSPHRASE secret. The first build
      # without that file creates a new key and commits the encrypted bundle, so
      # the key never exists anywhere in readable form. See signing/README.md.
      # Pull requests get no secrets; their builds fall back to the debug key.
      - name: Unlock the signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::The SIGNING_PASSPHRASE secret is missing, so this build can't be signed. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          bundle=signing/hondana-release.tar.gpg
          # Another build may have created the key since this one checked out.
          git fetch --quiet origin main
          if [ ! -f "$bundle" ] && git cat-file -e "origin/main:$bundle" 2>/dev/null; then
            git show "origin/main:$bundle" > "$bundle"
          fi
          if [ -f "$bundle" ]; then
            gpg --batch --quiet --pinentry-mode loopback --passphrase-file <(printf '%s' "$SIGNING_PASSPHRASE") \
              --decrypt "$bundle" | tar -x -C signing
            echo "::add-mask::$(sed -n 's/^storePassword=//p' signing/signing.properties)"
            echo "Signing with the key in $bundle."
          else
            echo "No release key yet: creating one."
            password=$(openssl rand -hex 32)
            echo "::add-mask::$password"
            keytool -genkeypair -keystore signing/hondana-release.jks -storetype PKCS12 \
              -alias hondana -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=Hondana, O=Holajack" -storepass "$password" -keypass "$password" -noprompt
            printf 'storeFile=hondana-release.jks\nstorePassword=%s\nkeyAlias=hondana\nkeyPassword=%s\n' \
              "$password" "$password" > signing/signing.properties
            tar -C signing -cf - hondana-release.jks signing.properties |
              gpg --batch --quiet --pinentry-mode loopback --passphrase-file <(printf '%s' "$SIGNING_PASSPHRASE") \
                --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
                --output "$bundle"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$bundle"
            git commit --quiet -m "Signing: new release key, stored encrypted"
            # A rejected push (main moved on) fails the build rather than signing with an unsaved key.
            git push --quiet origin HEAD:main
            echo "Created and committed a new release key."
          fi
          keytool -list -v -keystore signing/hondana-release.jks \
            -storepass "$(sed -n 's/^storePassword=//p' signing/signing.properties)" | grep -m1 'SHA256:'

      - name: Build release APK
        # --continue: report every independent failure (compile, packaging, R8) in one run.
        # -Penable-updater: the app checks this repo's releases for new builds.
        run: ./gradlew assembleRelease --stacktrace --continue -Penable-updater

      - name: Collect APKs
        id: collect
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-universal-release.apk out/hondana.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/hondana-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/hondana-armeabi-v7a.apk
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hondana-r${{ steps.collect.outputs.count }}-${{ steps.collect.outputs.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-r${{ steps.collect.outputs.count }}
          path: app/build/outputs/mapping/release
          retention-days: 30

      # Never publish an APK signed with anything but the release key.
      - name: Check the APK signature
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs out/hondana-arm64-v8a.apk | tee "$RUNNER_TEMP/signer.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/signer.txt"; then
            echo "::error::The APK is signed with the debug key, not the release key."
            exit 1
          fi

      # A release asset is a plain link a phone browser can download without a
      # GitHub sign-in, and the in-app updater reads these releases (r<number>).
      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.collect.outputs.count }}
          SHA: ${{ steps.collect.outputs.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          TAG="r${COUNT}"
          # What's new: the commits in this push (the app shows this text in its update screen).
          CHANGES=""
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGES=$(git log --no-merges -n 30 --format='- %s' "${BEFORE}..HEAD")
          fi
          [ -n "$CHANGES" ] || CHANGES=$(git log -1 --format='- %s' "$GITHUB_SHA")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          NOTES=$(cat <<EOF
          ${CHANGES}

          **Install:** [hondana-arm64-v8a.apk](${URL}/hondana-arm64-v8a.apk) for almost every phone from 2017 on, or [hondana.apk](${URL}/hondana.apk) (universal, larger). After that Hondana offers new builds itself.

          Build ${TAG} from \`${SHA}\`.
          EOF
          )
          # The old rolling "hondana-latest" release has no build number; the updater only reads r<number> tags.
          gh release delete hondana-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/hondana.apk out/hondana-arm64-v8a.apk out/hondana-armeabi-v7a.apk --clobber
          else
            gh release create "$TAG" out/hondana.apk out/hondana-arm64-v8a.apk out/hondana-armeabi-v7a.apk \
              --target "$(git rev-parse HEAD)" \
              --title "Hondana ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
          # Keep the ten newest builds.
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | test("^r[0-9]+$"))][10:][].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
